# The site builds to static files in build/ (adapter-static) and is hosted in
# public_html — see deploy/README.md. This file is kept only for a Netlify
# preview: the pages work there, but signups do not, because the waitlist
# posts to waitlist.php and Netlify does not run PHP. The form says so rather
# than pretending to succeed.
[build]
	command = "pnpm run build"
	publish = "build"

[build.environment]
	NODE_VERSION = "22"
	# Netlify defaults to an older pnpm; pin it to what the lockfile was written with.
	PNPM_VERSION = "11"
